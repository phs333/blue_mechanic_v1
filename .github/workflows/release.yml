name: Build and Release Blue Mechanic Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da release (ex: v2.1)'
        required: true
        default: 'v2.1'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run automated test suite
        run: |
          python -m unittest discover tests

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm blue_mechanic.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueMechanic_v2.1
          path: dist/BlueMechanic_v2.1.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Blue Mechanic ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/BlueMechanic_v2.1.exe
          draft: false
          prerelease: false
          generate_release_notes: true
